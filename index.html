<style>
  /* Plano B: página única, sem servidor e sem banco. Tudo roda no celular. Mídias em ./jogo/ */
  :root { --profundo:#10231B; --tecnico:#1E583A; --dourado:#D2AC63; --marfim:#F5F3ED; --verde:#2ee05a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--marfim); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
         background: radial-gradient(120% 70% at 50% 0%, #1E583A 0%, #10231B 55%, #0a1711 100%) fixed; overflow-x: hidden; }
  .fundo { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .fundo video, .fundo img { width: 100%; height: 100%; object-fit: cover; }
  .fundo video { opacity: .6; } .fundo img { opacity: .45; }
  .fundo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(16,35,27,.65), rgba(16,35,27,.8) 55%, var(--profundo)); }
  .wrap { position: relative; z-index: 1; max-width: 28rem; margin: 0 auto; padding: max(1.25rem, env(safe-area-inset-top)) 1.25rem 2rem; min-height: 100vh; display: flex; flex-direction: column; }
  header { position: relative; text-align: center; margin-bottom: 1.25rem; }
  header img { height: 3rem; }
  .t1 { margin: .4rem 0 0; font-size: 1.1rem; font-weight: 600; }
  .t2 { margin: 0; font: 700 1.9rem/1 "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif; letter-spacing: .03em; text-transform: uppercase; color: var(--dourado); }
  .compacto .t1, .compacto .linha { display: none; } .compacto img { height: 2.25rem; } .compacto .t2 { font-size: 1.3rem; margin-top: .25rem; }
  .linha { height: 1px; width: 10rem; margin: .5rem auto 0; background: linear-gradient(90deg, transparent, var(--dourado), transparent); }
  .som { position: absolute; right: 0; top: 0; width: 2.5rem; height: 2.5rem; border-radius: 50%; border: 0; background: rgba(255,255,255,.1); color: rgba(245,243,237,.85); display: grid; place-items: center; cursor: pointer; }
  main { flex: 1; }
  .card { border: 1px solid rgba(210,172,99,.2); background: rgba(255,255,255,.06); border-radius: 1rem; padding: 1.25rem; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .center { text-align: center; }
  h1 { font-size: 1.3rem; line-height: 1.3; margin: 0 0 .5rem; }
  p { line-height: 1.5; margin: 0; }
  .muted { color: rgba(245,243,237,.8); } .gold { color: var(--dourado); }
  .rot { font-size: .75rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--dourado); }
  .tiny { font-size: .75rem; color: rgba(245,243,237,.5); text-align: center; margin-top: 1rem; }
  .stack > * + * { margin-top: 1rem; }
  .btn { display: flex; align-items: center; justify-content: center; gap: .6rem; width: 100%; min-height: 3.5rem; border: 0; border-radius: 1rem; padding: 0 1.25rem; font: 700 1.125rem system-ui, sans-serif; cursor: pointer; text-decoration: none; transition: transform .1s, opacity .2s; }
  .btn:active { transform: scale(.98); } .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-ouro { background: linear-gradient(#f1cf6b, var(--dourado)); color: var(--profundo); box-shadow: 0 8px 24px -8px rgba(210,172,99,.6); }
  .btn-zap { background: #25D366; color: #0b2e17; box-shadow: 0 8px 24px -8px rgba(37,211,102,.6); }
  .btn-ghost { background: transparent; color: var(--marfim); border: 1px solid rgba(245,243,237,.3); }
  /* mídia da pergunta */
  .midia { position: relative; margin: 0 -.25rem; aspect-ratio: 4/3; overflow: hidden; border-radius: 1.5rem; border: 1px solid rgba(210,172,99,.25); background: var(--profundo); box-shadow: 0 20px 40px -20px rgba(0,0,0,.8); }
  .midia > img, .midia > video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .midia::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(16,35,27,.5), rgba(16,35,27,.1) 40%, var(--profundo)); pointer-events: none; }
  .topo { position: absolute; z-index: 2; inset: 0 0 auto 0; display: flex; justify-content: space-between; align-items: center; padding: .75rem; }
  .chip { border-radius: 999px; background: rgba(16,35,27,.8); padding: .25rem .75rem; font-size: .85rem; font-weight: 600; }
  .dots { display: flex; gap: .35rem; border-radius: 999px; background: rgba(16,35,27,.7); padding: .4rem .6rem; }
  .dot { width: .5rem; height: .5rem; border-radius: 50%; background: rgba(255,255,255,.3); } .dot.ok { background: var(--verde); } .dot.atual { background: var(--dourado); }
  .legenda { position: absolute; z-index: 2; inset: auto 0 0 0; padding: .75rem; font-size: .7rem; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: rgba(245,243,237,.85); }
  .ar { position: absolute; z-index: 1; inset: 0; width: 100%; height: 100%; }
  .ar path { stroke: rgba(150,215,255,.75); stroke-width: 4; stroke-linecap: round; fill: none; stroke-dasharray: 14 10; animation: ar 1.6s linear infinite; }
  .medidores { position: absolute; z-index: 2; left: .75rem; right: .75rem; bottom: 2.4rem; display: flex; justify-content: space-between; gap: .5rem; font-size: .7rem; font-weight: 600; }
  .medidores span { background: rgba(16,35,27,.85); border-radius: .5rem; padding: .25rem .5rem; }
  /* alternativas e feedback */
  .opt { display: flex; gap: .75rem; align-items: flex-start; width: 100%; text-align: left; padding: 1rem; border-radius: 1rem; cursor: pointer; border: 2px solid rgba(255,255,255,.1); background: rgba(255,255,255,.06); color: var(--marfim); font: inherit; font-size: 1.05rem; line-height: 1.35; }
  .opt + .opt { margin-top: .75rem; }
  .opt .k { flex: none; width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center; border: 2px solid rgba(255,255,255,.4); font-weight: 700; }
  .opt[aria-checked="true"] { border-color: var(--verde); background: rgba(30,88,58,.7); box-shadow: 0 0 20px -6px rgba(46,224,90,.6); }
  .opt[aria-checked="true"] .k { background: var(--verde); border-color: var(--verde); color: var(--profundo); }
  .opt:focus-visible, .btn:focus-visible, .som:focus-visible { outline: 3px solid var(--dourado); outline-offset: 3px; }
  .fb { border-radius: 1rem; padding: 1.25rem; }
  .fb.certo { background: var(--tecnico); border: 1px solid rgba(46,224,90,.6); }
  .fb.errado { background: rgba(255,255,255,.06); border: 1px solid rgba(210,172,99,.4); }
  .fb strong.tit { display: block; font: 700 1.6rem/1.2 "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; margin-bottom: .25rem; }
  .nota { font: 700 5.5rem/1 "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; color: var(--dourado); margin-top: .4rem; }
  .nota small { font-size: 2rem; color: rgba(245,243,237,.5); }
  .grid5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: .5rem; list-style: none; padding: 0; margin: 0; }
  .grid5 li { border-radius: .75rem; padding: .7rem 0; text-align: center; background: rgba(255,255,255,.08); }
  .grid5 li.ok { background: var(--tecnico); }
  .grid5 span { display: block; font-size: .75rem; color: rgba(245,243,237,.7); } .grid5 b { font-size: 1.25rem; }
  /* animações */
  .entra { animation: entra .4s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes entra { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .kenburns { animation: kenburns 14s ease-in-out infinite alternate; }
  @keyframes kenburns { from { transform: scale(1.06); } to { transform: scale(1.18) translate(-3%, -2%); } }
  .tremor { animation: tremor .45s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes tremor { 0%,100% { transform: none; } 15%,55% { transform: translateX(-9px); } 35%,75% { transform: translateX(9px); } }
  .brilho { animation: brilho .9s ease-out 2; }
  @keyframes brilho { 0% { box-shadow: 0 0 0 0 rgba(46,224,90,.65); } 100% { box-shadow: 0 0 0 22px rgba(46,224,90,0); } }
  @keyframes ar { to { stroke-dashoffset: -60; } }
  .flocos { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
  .floco { position: absolute; top: -2%; border-radius: 50%; background: rgba(220,240,255,.85); filter: blur(.4px); animation: cair linear infinite; }
  @keyframes cair { 0% { transform: translateY(-10%); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(110vh); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .entra, .kenburns, .tremor, .brilho, .floco, .ar path { animation: none; } }
  .rodape { margin-top: 2rem; text-align: center; font-size: .75rem; letter-spacing: .2em; color: rgba(245,243,237,.4); }
</style>

    o: { A: 'Sim, com resfriamento prolongado.', B: 'Sim, se houver alta umidade.', C: 'Não. Refrigeração não elimina vírus.' }, c: 'C',
    f: 'Refrigeração conserva, mas não cura. Um vírus que já está no lote continua lá, por isso a sanidade precisa ser garantida na origem.',
    m: { foto: 'jogo/p4.jpg', legenda: 'Inspeção dos tubérculos' } },
  { p: 'Quais indicadores ajudam a avaliar melhor o armazenamento?',
    o: { A: 'Apenas a temperatura programada.', B: 'Temperatura da massa, horas em desvio, umidade, perdas e desempenho no campo.', C: 'Somente as toneladas armazenadas.' }, c: 'B',
    f: 'A temperatura programada é só a meta. Temperatura da massa, horas fora da faixa, umidade, perdas e o resultado no campo mostram o que realmente aconteceu.',
    m: { foto: 'jogo/p5.jpg', legenda: 'Corredor da câmara de armazenamento' } },
]
const FAIXAS = [
  { ate: 1, nome: 'Atenção aos fundamentos', msg: 'Há pontos básicos do armazenamento que merecem um olhar mais atento. É justamente nesses detalhes invisíveis que a safra se decide.' },
  { ate: 3, nome: 'Em desenvolvimento', msg: 'Você já enxerga parte do que acontece dentro da câmara. Aprofundar os indicadores certos faz a diferença no resultado do campo.' },
  { ate: 5, nome: 'Consciência técnica avançada', msg: 'Você reconhece que o armazenamento vai além da temperatura programada. Esse olhar técnico protege o potencial da semente.' },
]
const AVISO = 'Esta é uma avaliação educativa das suas respostas. Não é uma auditoria da sua propriedade nem uma medição de produtividade.'
const WHATSAPP = 'https://wa.me/553491389331?text=' + encodeURIComponent('Olá, Erick! Fiz o Jogo da Safra Invisível da Total Service Farm e quero saber mais.')
const ZAP_SVG = '<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M20.5 3.5A11.8 11.8 0 0 0 12 0C5.4 0 .1 5.3.1 11.9c0 2.1.6 4.1 1.6 5.9L0 24l6.4-1.7a11.9 11.9 0 0 0 5.6 1.4h.1c6.6 0 11.9-5.3 11.9-11.9 0-3.2-1.2-6.2-3.5-8.3ZM12 21.7c-1.8 0-3.5-.5-5-1.4l-.4-.2-3.8 1 1-3.7-.2-.4a9.8 9.8 0 0 1-1.5-5.2c0-5.5 4.4-9.9 9.9-9.9 2.6 0 5.1 1 7 2.9a9.8 9.8 0 0 1 2.9 7c0 5.5-4.4 9.9-9.9 9.9Zm5.4-7.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1l-.9 1.2c-.2.2-.3.2-.6.1a8.1 8.1 0 0 1-4-3.5c-.3-.5.3-.5.9-1.6.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6a1.2 1.2 0 0 0-.8.4 3.5 3.5 0 0 0-1.1 2.6 6 6 0 0 0 1.3 3.2 13.8 13.8 0 0 0 5.3 4.7c2 .8 2.7.9 3.7.8.6-.1 1.8-.8 2.1-1.5.3-.7.3-1.4.2-1.5-.1-.2-.3-.2-.6-.4Z"/></svg>'

// ── Som de acerto (Web Audio, sem arquivo) e vibração de erro (Android; o iPhone não vibra) ──
let somOn = localStorage.getItem('safra:som') !== '0', ctx = null
function destravar() {
  try { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; ctx = ctx || new AC(); if (ctx.state === 'suspended') ctx.resume()
        const o = ctx.createOscillator(), g = ctx.createGain(); g.gain.value = 0; o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + .01) } catch (e) {}
}
function somAcerto() {
  if (!somOn) return
  try { destravar(); if (!ctx) return; const t0 = ctx.currentTime + .02
        ;[523.25, 659.25, 783.99, 1046.5].forEach((f, i) => { const o = ctx.createOscillator(), g = ctx.createGain(), t = t0 + i * .075
          o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.22, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + .38)
          o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + .4) }) } catch (e) {}
}
function vibrarErro() { if (!somOn) return; try { if (navigator.vibrate) navigator.vibrate([140, 70, 140]) } catch (e) {} }
const ICONE_SOM = (on) => `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z" fill="currentColor"/>${on ? '<path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>' : '<path d="m16 9 5 6m0-6-5 6"/>'}</svg>`
const btnSom = document.getElementById('som')
function pintaSom() { btnSom.innerHTML = ICONE_SOM(somOn); btnSom.setAttribute('aria-label', somOn ? 'Desligar som e vibração' : 'Ligar som e vibração') }
btnSom.onclick = () => { somOn = !somOn; localStorage.setItem('safra:som', somOn ? '1' : '0'); if (somOn) destravar(); pintaSom() }
pintaSom()

// ── Fundo e flocos ──
const fundo = document.getElementById('fundo')
const flocos = (n) => '<div class="flocos">' + Array.from({ length: n }, (_, i) => { const s = 2 + (i * 5) % 4
  return `<span class="floco" style="left:${(i * 37) % 100}%;width:${s}px;height:${s}px;animation-duration:${7 + (i * 13) % 9}s;animation-delay:-${(i * 7) % 11}s"></span>` }).join('') + '</div>'
function setFundo(tipo) {
  if (fundo.dataset.tipo === tipo) return
  fundo.dataset.tipo = tipo
  fundo.innerHTML = tipo === 'video' ? `<video src="jogo/abertura.mp4" poster="jogo/abertura.jpg" autoplay muted loop playsinline></video>${flocos(18)}`
    : tipo === 'foto' ? '<img class="kenburns" src="jogo/resultado.jpg" alt="">' : ''
}
const cab = document.getElementById('cab')

const app = document.getElementById('app')
let estado = { i: -1, respostas: [], escolha: null, respondida: false, efeito: null }
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

function render() {
  const { i } = estado
  cab.classList.toggle('compacto', i >= 0 && i < PERGUNTAS.length)
  if (i < 0) return inicio()
  if (i >= PERGUNTAS.length) return resultado()
  pergunta()
}

function inicio() {
  setFundo('video')
  app.innerHTML = `
    <div class="stack entra" style="padding-top:1.5rem">
      <div class="card">
        <p class="rot">Dentro da câmara fria</p>
        <h1 style="margin-top:.5rem">O que acontece com a semente quando ninguém está olhando?</h1>
        <p class="muted"><b class="gold">5 perguntas rápidas</b> sobre armazenamento de batata-semente. Faça quantas vezes quiser.</p>
      </div>
      <button class="btn btn-ouro" id="comecar">Começar</button>
      <p class="tiny" style="color:rgba(245,243,237,.6)">Com som 🔊 · Imagens reais da operação</p>
      <p class="tiny">${AVISO}</p>
    </div>`
  document.getElementById('comecar').onclick = () => { destravar(); estado = { i: 0, respostas: [], escolha: null, respondida: false, efeito: null }; render() }
}

function midia(q, i, respondida) {
  const m = q.m
  const dots = PERGUNTAS.map((_, n) => `<span class="dot ${n < i || (n === i && respondida) ? 'ok' : n === i ? 'atual' : ''}"></span>`).join('')
  const visual = m.video ? `<video src="${m.video}" poster="${m.foto}" autoplay muted loop playsinline aria-hidden="true"></video>` : `<img class="kenburns" src="${m.foto}" alt="">`
  const ar = m.ar ? `<svg class="ar" viewBox="0 0 400 300" aria-hidden="true">${[60, 120, 180].map((y, k) => `<path style="animation-delay:-${k * .5}s" d="M-20 ${y} C 80 ${y - 40}, 160 ${y + 40}, 240 ${y} S 360 ${y - 30}, 430 ${y}"/>`).join('')}</svg>
     <div class="medidores"><span>Controlador <b style="color:#7fd3ff">4,0 °C</b></span><span>Massa <b class="gold">5,5 °C</b> <span style="font-weight:400;opacity:.6">(ilustrativo)</span></span></div>` : ''
  return `<div class="midia">${visual}${ar}${flocos(8)}
    <div class="topo"><span class="chip">Pergunta ${i + 1} de ${PERGUNTAS.length}</span><span class="dots" aria-hidden="true">${dots}</span></div>
    <p class="legenda">${esc(m.legenda)}</p></div>`
}

function pergunta() {
  setFundo('nenhum')
  const { i, escolha, respondida, efeito } = estado
  const q = PERGUNTAS[i]
  const opcoes = Object.entries(q.o).map(([k, t]) =>
    `<button class="opt" role="radio" aria-checked="${escolha === k}" data-k="${k}" ${respondida ? 'disabled' : ''}><span class="k">${escolha === k ? '✓' : k}</span><span>${esc(t)}</span></button>`).join('')
  let rodape
  if (!respondida) rodape = `<button class="btn btn-ouro" id="responder" ${escolha ? '' : 'disabled'}>Responder</button>`
  else {
    const certo = escolha === q.c
    rodape = `
      <div class="stack ${efeito === 'erro' ? 'tremor' : ''}">
        <div class="fb ${certo ? 'certo' : 'errado'} ${efeito === 'acerto' ? 'brilho' : ''}" role="status">
          <strong class="tit">${certo ? 'Resposta certa!' : 'Não foi dessa vez'}</strong>
          ${certo ? '' : `<p>Resposta esperada: <b class="gold">${q.c}. ${esc(q.o[q.c])}</b></p>`}
          <p style="margin-top:.6rem">${esc(q.f)}</p>
        </div>
        <button class="btn btn-ouro" id="proxima">${i === PERGUNTAS.length - 1 ? 'Ver meu resultado' : 'Próxima pergunta'}</button>
      </div>`
  }
  const mantemMidia = app.querySelector('.midia') && app.dataset.q === String(i)
  const midiaHtml = mantemMidia ? null : midia(q, i, respondida)
  if (mantemMidia) { // não reinicia o vídeo/foto ao escolher alternativa
    app.querySelector('.dots').innerHTML = PERGUNTAS.map((_, n) => `<span class="dot ${n < i || (n === i && respondida) ? 'ok' : n === i ? 'atual' : ''}"></span>`).join('')
    app.querySelector('#corpo').innerHTML = corpo()
  } else {
    app.dataset.q = String(i)
    app.innerHTML = `${midiaHtml}<section id="corpo" class="stack entra" style="margin-top:1rem" aria-labelledby="perg">${corpo()}</section>`
  }
  function corpo() { return `<h1 id="perg">${esc(q.p)}</h1><div role="radiogroup" aria-labelledby="perg">${opcoes}</div>${rodape}` }
  app.querySelectorAll('.opt').forEach((b) => b.onclick = () => { estado.escolha = b.dataset.k; render() })
  const r = document.getElementById('responder')
  if (r) r.onclick = () => {
    destravar()
    const certo = estado.escolha === q.c
    estado.respondida = true; estado.respostas[i] = certo; estado.efeito = certo ? 'acerto' : 'erro'
    if (certo) somAcerto(); else vibrarErro()
    render()
  }
  const n = document.getElementById('proxima')
  if (n) n.onclick = () => { estado = { ...estado, i: i + 1, escolha: null, respondida: false, efeito: null }; render(); window.scrollTo(0, 0) }
  // pré-carrega a mídia da próxima
  const prox = PERGUNTAS[i + 1]; const im = new Image(); im.src = prox ? prox.m.foto : 'jogo/resultado.jpg'
}

function resultado() {
  setFundo('foto')
  app.dataset.q = ''
  const nota = estado.respostas.filter(Boolean).length
  const faixa = FAIXAS.find((f) => nota <= f.ate)
  const cel = PERGUNTAS.map((_, n) => `<li class="${estado.respostas[n] ? 'ok' : ''}"><span>P${n + 1}</span><b class="${estado.respostas[n] ? '' : 'gold'}">${estado.respostas[n] ? '✓' : '✗'}</b></li>`).join('')
  app.innerHTML = `
    <div class="stack entra">
      <div class="card center">
        <p class="rot">Seu diagnóstico</p>
        <p class="nota" id="nota" aria-label="${nota} de ${PERGUNTAS.length}"><span id="conta">0</span><small>/${PERGUNTAS.length}</small></p>
        <h1 style="margin-top:.5rem">${faixa.nome}</h1>
        <p class="muted">${faixa.msg}</p>
      </div>
      <ol class="grid5" aria-label="Acertos por pergunta">${cel}</ol>
      <div class="card center">
        <p class="rot">Saiba mais</p>
        <p class="muted" style="margin:.25rem 0 1rem">Quer entender como preservar o potencial da sua batata-semente? Fale direto com <b>Erick Alberto</b>, engenheiro agrônomo.</p>
        <a class="btn btn-zap" href="${WHATSAPP}" target="_blank" rel="noopener noreferrer">${ZAP_SVG} Falar com o Erick</a>
      </div>
      <button class="btn btn-ghost" id="denovo">Jogar de novo</button>
      <p class="tiny">${AVISO}</p>
    </div>`
  let k = 0; const conta = document.getElementById('conta')
  if (nota > 0) { const t = setInterval(() => { k++; conta.textContent = k; if (k >= nota) { clearInterval(t); if (nota >= 4) somAcerto() } }, 220) }
  document.getElementById('denovo').onclick = () => { destravar(); estado = { i: 0, respostas: [], escolha: null, respondida: false, efeito: null }; render(); window.scrollTo(0, 0) }
  window.scrollTo(0, 0)
}

render()
</script>
</body>
</html>
